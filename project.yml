name: Lingyue
options:
  bundleIdPrefix: site.saudade
  deploymentTarget:
    iOS: "17.0"
packages:
  LingyueCore:
    path: .
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lingyue:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BuildSourceCommit: $(BUILD_SOURCE_COMMIT)
        CFBundleDisplayName: 泠月喵
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: site.saudade.lingyue
            CFBundleURLSchemes: [lingyue]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.saudade.lingyue
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: LingyueCore
      - package: MarkdownUI
      - target: LingyueIsland
        embed: true
  LingyueIsland:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared, Resources]
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BuildSourceCommit: $(BUILD_SOURCE_COMMIT)
        CFBundleDisplayName: 泠月喵灵动岛
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.saudade.lingyue.island
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: LingyueCore
schemes:
  Lingyue:
    build:
      targets:
        Lingyue: all
