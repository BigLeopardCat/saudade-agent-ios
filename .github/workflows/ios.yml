name: iOS build
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core protocol tests
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build simulator app and Live Activity extension
        run: |
          set -o pipefail
          xcodebuild -project Lingyue.xcodeproj -scheme Lingyue -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build | tee simulator-build.log
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project Lingyue.xcodeproj -scheme Lingyue -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build | tee device-build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Lingyue.app build/package/Payload/
          cd build/package
          zip -qry ../Lingyue-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Lingyue-unsigned-device
          path: build/Lingyue-unsigned.ipa
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: '*-build.log'
          if-no-files-found: ignore
          retention-days: 7
