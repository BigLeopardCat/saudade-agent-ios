name: iOS build
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core protocol tests
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          bash scripts/prepare_assets.sh
          xcodegen generate
      - name: Build simulator app and Live Activity extension
        run: |
          set -o pipefail
          xcodebuild -project Lingyue.xcodeproj -scheme Lingyue -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO BUILD_SOURCE_COMMIT="$(git rev-parse HEAD)" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build | tee simulator-build.log
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project Lingyue.xcodeproj -scheme Lingyue -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO BUILD_SOURCE_COMMIT="$(git rev-parse HEAD)" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build | tee device-build.log
      - name: Boot UI simulator
        timeout-minutes: 4
        run: |
          device=$(python3 scripts/boot_ui_simulator.py)
          echo "UI_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Run demo UI conversation and layout test
        timeout-minutes: 9
        run: |
          set -o pipefail
          xcodebuild test -project Lingyue.xcodeproj -scheme Lingyue -configuration Debug -sdk iphonesimulator -destination "id=$UI_SIMULATOR" -derivedDataPath build/simulator -resultBundlePath build/ui-tests.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES BUILD_SOURCE_COMMIT="$(git rev-parse HEAD)" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" | tee ui-test.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/ui-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path build/ui-screenshots
          fi
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Lingyue.app build/package/Payload/
          cd build/package
          zip -qry ../Lingyue-unsigned.ipa Payload
          cd ../..
          python3 scripts/verify_ipa.py build/Lingyue-unsigned.ipa --commit "$(git rev-parse HEAD)" --build "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: Lingyue-unsigned-device
          path: |
            build/Lingyue-unsigned.ipa
            build/build-manifest.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-conversation-results
          path: |
            build/ui-screenshots/*.png
            build/ui-screenshots/manifest.json
            ui-test.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: '*-build.log'
          if-no-files-found: ignore
          retention-days: 7
